[package]
name = "ttl-vault"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "29.0.1", features = ["alloc"] }

[features]
default = []
experimental-tests = []

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
proptest = { version = "1.4", default-features = false, features = ["std"] }
