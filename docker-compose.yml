version: '3.9'

# The backend stores its data in SQLite (see docs/adr/0006-sqlite-backend-storage.md).
# The database is a file on the `ethos_data` volume, so no database service is needed.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethos-protocol-backend
    environment:
      # Redis requires a password (#910). Set REDIS_PASSWORD in .env.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      NODE_ID: backend-primary
      CONSENSUS_STRATEGY: last_write_wins
      RUST_LOG: info
      # SQLite file on the named volume below. Survives `docker compose down`
      # (use `down -v` to delete it).
      DB_PATH: /var/lib/ethos-protocol/ethos-protocol.db
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # No source bind mounts here: this file runs the image built from the
      # Dockerfile, so what runs is what was built and scanned. Live reload
      # against ./backend/src lives in docker-compose.override.yml (#693).
      - ethos_data:/var/lib/ethos-protocol

  redis:
    image: redis:7-alpine
    container_name: ethos-protocol-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Loopback only, so the cache is not reachable from other hosts (#910).
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stellar-quickstart:
    # Not pinned by digest yet: the digest must be taken from a registry that
    # can be reached, then written here (#911).
    image: stellar/quickstart:latest
    container_name: stellar-quickstart
    environment:
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    # No host ports are published. Other containers reach it on the compose network.
    volumes:
      - quickstart_data:/var/lib/stellar

volumes:
  ethos_data:
  quickstart_data:
