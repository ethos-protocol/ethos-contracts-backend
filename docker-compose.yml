version: '3.9'

# The backend stores its data in SQLite (see docs/adr/0006-sqlite-backend-storage.md).
# The database is a file on the `ethos_data` volume, so no database service is needed.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethos-protocol-backend
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ID: backend-primary
      CONSENSUS_STRATEGY: last_write_wins
      RUST_LOG: info
      # SQLite file on the named volume below. Survives `docker compose down`
      # (use `down -v` to delete it).
      DB_PATH: /var/lib/ethos-protocol/ethos-protocol.db
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ethos_data:/var/lib/ethos-protocol

  redis:
    image: redis:7-alpine
    container_name: ethos-protocol-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: stellar-quickstart
    environment:
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    ports:
      - "8000:8000"
      - "11626:11626"
    volumes:
      - quickstart_data:/var/lib/stellar

volumes:
  ethos_data:
  quickstart_data:
