version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      RUST_ENV: development
      RUST_BACKTRACE: "1"
      # Local development only: admin routes accept requests without
      # ADMIN_API_KEY (#700). Never set this outside a dev machine.
      ALLOW_INSECURE_ADMIN: "true"
    ports:
      - "3000:3000"
    # Local development only: cargo-watch reloads on host edits (#693).
    volumes:
      - ./backend/src:/app/src

  stellar-quickstart:
    environment:
      STANDALONE: "true"
