title = "Ethos-Protocol gitleaks config"

# ── Coverage audit finding (#397) ──────────────────────────────────────────────
#
# This file previously defined only an [allowlist] with no [[rules]] and no
# [extend] block. Per gitleaks' own semantics, a config with no [extend]
# block does NOT fall back to the built-in ruleset — it replaces it, meaning
# with zero [[rules]] defined, gitleaks was scanning with **zero detection
# rules** in both CI (.github/workflows/ci.yml, .github/workflows/security.yml)
# and the local pre-commit hook (scripts/pre-commit-secret-scan.sh): every
# run reported "no secrets found" regardless of what was actually staged or
# committed. `useDefault = true` below restores the ~180-rule built-in
# ruleset (AWS, GCP, Stripe, Slack, generic API keys, PEM private keys, ...);
# the [[rules]] further down extend it with formats specific to this repo.
[extend]
  useDefault = true

[allowlist]
  description = "Allow test/example values and documentation placeholders"
  # gitleaks `paths` entries are regexes, not globs.
  paths = [
    '''\.env\.example$''',
    '''README\.md$''',
    '''docs/''',
    '''mobile/''',
    '''backend/src/websocket\.rs$''',
    # Intentionally secret-shaped fixtures used to verify pattern coverage
    # in CI (see scripts/secret-scan-fixtures/ and the "Secret Scan Fixture
    # Coverage" job in .github/workflows/security.yml). These are excluded
    # from the repo-wide scan so they don't self-trigger it; the fixture
    # coverage job scans this directory directly with a config that does
    # NOT carry this allowlist entry, so detection is still verified.
    '''scripts/secret-scan-fixtures/positive/'''
  ]
  regexes = [
    "test-secret-key-for-unit-tests",
    "tok-secret",
    "REMINDER_ENCRYPTION_SECRET=",
  ]
  # Historical revisions of docker-compose.yml that committed the local-dev
  # Postgres credential pair (#688). History is not rewritten,
  # so these commits are allowlisted by SHA. The current tree no longer contains
  # the pair. Anyone who ran that compose file outside a laptop should rotate it.
  commits = [
    "d4dfd88a587f8b49a83161a1959e536fda083771",
    "8373192cc47075de678550f7aff6ef88eccc0c98",
  ]

# ── Project-specific secret patterns (#397) ───────────────────────────────────
#
# gitleaks' built-in ruleset already covers generic high-entropy API keys,
# PEM-encoded private keys, and a long list of SaaS providers (AWS, GCP,
# Stripe, Slack, SendGrid, ...). The rules below extend it with formats that
# are specific to this repo's own dependencies/integrations and are NOT part
# of the built-in ruleset. Coverage audited 2026-08-30 — see
# docs/secret-scanning.md for the full pattern coverage table and the
# fixtures that exercise each rule.

[[rules]]
  id = "stellar-secret-seed"
  description = "Stellar/Soroban secret seed (StrKey 'S...' signing key — never the 'G...' public address)"
  regex = '''\bS[A-Z2-7]{55}\b'''
  tags = ["stellar", "soroban", "secret-key"]

[[rules]]
  id = "database-connection-string-with-credentials"
  description = "Database/cache connection URI with an embedded username:password (Postgres, MySQL, MongoDB, Redis)"
  regex = '''\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|rediss)://[^\s:'"@/]+:[^\s@'"]{3,}@[^\s'"]+'''
  tags = ["database", "connection-string"]

# The Postgres user/password pair that docker-compose.yml used to hard-code and
# that was reused across environments (#688). Matched literally so the pair is
# caught wherever it appears, including outside a connection URI. The generic
# `\w+_user:\w+_password@` allowlist entry was removed for the same reason.
[[rules]]
  id = "ethos-local-postgres-credential-pair"
  description = "Hard-coded Ethos local Postgres credential pair (formerly in docker-compose.yml, #688)"
  # Written as `ethos_pass(?:word)` so this file does not contain the literal pair it detects.
  regex = '''ethos_user:ethos_pass(?:word)'''
  tags = ["database", "credentials"]

[[rules]]
  id = "abuseipdb-api-key"
  description = "AbuseIPDB API key (ABUSEIPDB_API_KEY, consumed by backend/src/ip_reputation.rs)"
  regex = '''(?i)abuseipdb[a-z0-9_ =:"'\-]{0,20}\b([a-f0-9]{80})\b'''
  tags = ["abuseipdb", "api-key"]

[[rules]]
  id = "fcm-legacy-server-key"
  description = "Firebase Cloud Messaging legacy server key (FCM_SERVER_KEY, consumed by backend/src/notifications.rs)"
  regex = '''\bAAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{140,}\b'''
  tags = ["firebase", "fcm", "api-key"]
