name: Stellar Integration Tests

on:
  schedule:
    # Run daily at 03:00 UTC against testnet
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stellar-integration:
    name: Stellar Integration Tests (testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      STELLAR_INTEGRATION_TESTS: '1'
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      CONTRACT_TTL_VAULT: ${{ secrets.CONTRACT_TTL_VAULT || vars.CONTRACT_TTL_VAULT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Verify required configuration
        run: |
          if [ -z "${CONTRACT_TTL_VAULT}" ]; then
            echo "::error::CONTRACT_TTL_VAULT is not set. Configure it as a repository secret or variable."
            exit 1
          fi

      - name: Run ignored Stellar integration tests
        run: cargo test -p backend -- --ignored