name: OpenAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  schema:
    name: OpenAPI schema validation & drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-openapi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Validate openapi.yaml is a well-formed spec
        run: |
          python3 -m pip install --quiet openapi-spec-validator
          openapi-spec-validator docs/openapi.yaml

      - name: Schema-validation middleware unit tests
        run: |
          set -euo pipefail
          tests="$(cargo test --package ethos-protocol-backend schema_validation -- --list)"
          printf '%s\n' "$tests"
          if ! grep -q '^schema_validation::tests::' <<< "$tests"; then
            echo "No schema-validation unit tests were discovered."
            exit 1
          fi
          cargo test --package ethos-protocol-backend schema_validation

      - name: Fail if handlers drift from docs/openapi.yaml
        run: node scripts/check_openapi_drift.mjs

      - name: Regenerate the TypeScript client and check it is committed
        run: node scripts/generate_ts_client.mjs --check
