name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every day at 02:00 UTC to catch newly published advisories
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match ci.yml — newer rustc rejects a transitive Soroban SDK
      # unsound transmute in ethnum 1.5.2 with E0512.
      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run vulnerability scan (block on high severity)
        id: audit
        run: |
          # Capture JSON report for artifact upload; allow non-zero so we can
          # still upload the report even when vulns are found.
          cargo audit --deny warnings --json > audit-report.json 2>&1 || true
          # Human-readable output — this is the step that actually fails the job.
          cargo audit --deny warnings

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny license and advisory check
        run: cargo deny check advisories licenses

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  secret-scan-fixture-coverage:
    # Regression check for #397: proves the pattern list in .gitleaks.toml
    # (built-in ruleset + our custom rules) actually detects every documented
    # secret format, and doesn't false-positive on the documented safe cases.
    # See scripts/secret-scan-fixtures/ and docs/secret-scanning.md.
    name: Secret Scan Fixture Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Verify every positive fixture is detected
        run: |
          FAILED=0
          for f in scripts/secret-scan-fixtures/positive/*.txt; do
            if gitleaks detect --no-git --source "$f" \
                --config scripts/secret-scan-fixtures/gitleaks-fixtures.toml \
                --redact --exit-code 1 >/tmp/gitleaks-out.txt 2>&1; then
              echo "::error file=$f::expected a secret to be detected in this positive fixture, but gitleaks found nothing"
              cat /tmp/gitleaks-out.txt
              FAILED=1
            else
              echo "OK (detected): $f"
            fi
          done
          exit $FAILED

      - name: Verify no negative fixture is flagged
        run: |
          FAILED=0
          for f in scripts/secret-scan-fixtures/negative/*.txt; do
            if gitleaks detect --no-git --source "$f" \
                --config scripts/secret-scan-fixtures/gitleaks-fixtures.toml \
                --redact --exit-code 1 >/tmp/gitleaks-out.txt 2>&1; then
              echo "OK (clean): $f"
            else
              echo "::error file=$f::expected no secret to be detected in this negative fixture, but gitleaks found one (false positive)"
              cat /tmp/gitleaks-out.txt
              FAILED=1
            fi
          done
          exit $FAILED
