    CostEntry:
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        recorded_at:
          type: string
          format: date-time
      required: [id, operation, tags, amount, currency, recorded_at]

    CostReport:
      type: object
      properties:
