          description: Two-factor configuration removed

  /api/vaults/{vault_id}/2fa/challenge:
    post:
      summary: Check whether the vault requires a second-factor challenge
      operationId: challengeTwoFactor
      tags:
        - Two-Factor Authentication
      parameters:
        - name: vault_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
