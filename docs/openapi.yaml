      type: object
      properties:
        operation:
          type: string
        tx_hash:
          type: string
        fee_stroops:
          type: integer
          format: int64
          minimum: 0
        ledger_sequence:
          type: integer
          format: int64
          minimum: 0
        tags:
          type: object
          additionalProperties:
            type: string
      required: [operation, tx_hash, fee_stroops, ledger_sequence]

    GasCostEntry:
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
        tx_hash:
          type: string
        fee_stroops:
          type: integer
          format: int64
        ledger_sequence:
          type: integer
          format: int64
        tags:
          type: object
          additionalProperties:
            type: string
        recorded_at:
          type: string
          format: date-time
      required: [id, operation, tx_hash, fee_stroops, ledger_sequence, tags, recorded_at]

    GasCostReport:
      type: object
      properties:
        total_fee_stroops:
          type: integer
          format: int64
        tx_count:
          type: integer
        by_operation:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
              tx_count:
                type: integer
              total_fee_stroops:
                type: integer
                format: int64
              avg_fee_stroops:
                type: integer
                format: int64
              max_fee_stroops:
                type: integer
                format: int64
              min_fee_stroops:
                type: integer
                format: int64
            required: [operation, tx_count, total_fee_stroops, avg_fee_stroops, max_fee_stroops, min_fee_stroops]
      required: [total_fee_stroops, tx_count, by_operation]

    CostDashboard:
      type: object
      properties:
        fiat_summary:
          type: object
          properties:
            total_amount:
              type: number
              format: double
            currency:
              type: string
            entry_count:
              type: integer
          required: [total_amount, currency, entry_count]
        gas_summary:
          type: object
          properties:
            total_fee_stroops:
              type: integer
              format: int64
            tx_count:
              type: integer
          required: [total_fee_stroops, tx_count]
        active_thresholds:
          type: integer
        breached_thresholds:
          type: integer
        top_fiat_operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationCostItem'
        top_gas_operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationCostItem'
        generated_at:
          type: string
          format: date-time
      required: [fiat_summary, gas_summary, active_thresholds, breached_thresholds, top_fiat_operations, top_gas_operations, generated_at]

    OperationCostItem:
      type: object
      properties:
        operation:
          type: string
        total:
          type: number
          format: double
      required: [operation, total]

    OptimizationSuggestion:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        description:
          type: string
        estimated_saving_fraction:
          type: number
          format: double
        applies_to:
          type: string
          nullable: true
      required: [id, severity, title, description, estimated_saving_fraction]

    # ── Disaster Recovery schemas ──────────────────────────────────────────

    DrStep:
      type: string
      enum: [pause_contract, unpause_contract, restore_vault]

    RequestDrActionRequest:
      type: object
      properties:
        step:
          $ref: '#/components/schemas/DrStep'
        vault_id:
          type: integer
          format: int64
          nullable: true
        requested_by:
          type: string
      required: [step, requested_by]

    RequestDrActionResponse:
      type: object
      properties:
        step:
          $ref: '#/components/schemas/DrStep'
        confirmation_token:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
      required: [step, confirmation_token, expires_at]

    DrActionResult:
      type: object
      properties:
        step:
          $ref: '#/components/schemas/DrStep'
        success:
          type: boolean
        output:
          type: string
        executed_at:
          type: string
          format: date-time
      required: [step, success, output, executed_at]

    RtoRpoTargets:
      type: object
      properties:
        p0_rto_minutes:
          type: integer
        p0_rpo_minutes:
          type: integer
        p1_rto_minutes:
          type: integer
        p1_rpo_minutes:
          type: integer
        p2_rto_minutes:
          type: integer
        p2_rpo_minutes:
          type: integer
        p3_rto_minutes:
          type: integer
        p3_rpo_minutes:
          type: integer
        last_reviewed:
          type: string
          format: date
      required: [p0_rto_minutes, p0_rpo_minutes, p1_rto_minutes, p1_rpo_minutes, p2_rto_minutes, p2_rpo_minutes, p3_rto_minutes, p3_rpo_minutes, last_reviewed]

    DrTestEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        cadence:
          type: string
          enum: [weekly, monthly, quarterly, annually]
        step:
          $ref: '#/components/schemas/DrStep'
        owner:
          type: string
        last_run:
          type: string
          nullable: true
        next_due:
          type: string
      required: [id, name, description, cadence, step, owner, next_due]

    IncidentPlaybook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [P0, P1, P2, P3]
        triggers:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
              action:
                type: string
              automated:
                type: boolean
              dr_step:
                allOf:
                  - $ref: '#/components/schemas/DrStep'
                nullable: true
            required: [order, action, automated]
        escalation_contacts:
          type: array
          items:
            type: string
        runbook_refs:
          type: array
          items:
            type: string
      required: [id, name, description, severity, triggers, steps, escalation_contacts, runbook_refs]

    # ── Feature Flag schemas ───────────────────────────────────────────────

    UpsertFeatureFlagRequest:
      type: object
      properties:
        key:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: false
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        updated_by:
          type: string
          nullable: true
      required: [key]

    FeatureFlagVersionSnapshot:
      type: object
      properties:
        version:
          type: integer
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          nullable: true
      required: [version, enabled, rollout_percentage, updated_at]

    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagVersionSnapshot'
      required: [key, enabled, rollout_percentage, version, created_at, updated_at, history]

    EvaluateFeatureFlagRequest:
      type: object
      properties:
        subject_id:
          type: string
      required: [subject_id]

    FeatureFlagEvaluation:
      type: object
      properties:
        key:
          type: string
        subject_id:
          type: string
        enabled:
          type: boolean
        reason:
          type: string
        flag_version:
          type: integer
      required: [key, subject_id, enabled, reason, flag_version]

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication for passkey-authenticated requests

security:
  - ApiKeyAuth: []
  - BearerAuth: []
