          type: integer
      required:
        - date
        - vaults_created
        - vaults_released

    VaultAnalytics:
      type: object
      properties:
        total_vaults:
          type: integer
        active_vaults:
          type: integer
        average_ttl_seconds:
          type: number
          format: double
        release_rate:
          type: number
          format: double
          description: Fraction of vaults that are released
        time_series:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
      required:
        - total_vaults
        - active_vaults
        - average_ttl_seconds
        - release_rate
        - time_series

    SharePermission:
      type: string
      enum: [view_only, edit, admin]

    VaultShare:
      type: object
      properties:
        share_id:
          type: string
          format: uuid
        vault_id:
          type: string
        shared_with:
          type: string
          description: Address or email vault is shared with
        permission:
          $ref: '#/components/schemas/SharePermission'
        created_at:
          type: string
          format: date-time
      required:
        - share_id
        - vault_id
        - shared_with
        - permission
        - created_at

    ShareRequest:
      type: object
      properties:
        shared_with:
          type: string
          description: Address or email to share with
        permission:
          $ref: '#/components/schemas/SharePermission'
      required:
        - shared_with
        - permission

    VaultBackup:
      type: object
      properties:
        backup_id:
          type: string
          format: uuid
        vault_id:
          type: string
        created_at:
          type: string
          format: date-time
        encrypted_payload:
          type: string
          description: Base64-encoded AES-GCM encrypted vault state JSON
      required:
        - backup_id
        - vault_id
        - created_at
        - encrypted_payload

    RestoreRequest:
      type: object
      properties:
        backup_id:
          type: string
          format: uuid
        encryption_key:
          type: string
          description: Base64-encoded 32-byte AES key used during backup
      required:
        - backup_id
        - encryption_key

    ScenarioType:
      type: string
      enum:
        - no_check_ins
        - consistent_check_ins
        - missed_check_in_dates
      description: >
        The check-in behaviour scenario to simulate.

        - `no_check_ins` — owner never checks in again; vault releases when current TTL expires.
        - `consistent_check_ins` — owner checks in at every interval indefinitely; vault never releases.
        - `missed_check_in_dates` — owner misses N consecutive check-ins, then stops.

    ScenarioResult:
      type: object
      description: Projected release outcome for a single scenario
      properties:
        scenario:
          $ref: '#/components/schemas/ScenarioType'
        description:
          type: string
          description: Human-readable description of the scenario assumptions
        projected_release_at:
          type: string
          format: date-time
          description: >
            Projected UTC timestamp when the vault will release under this scenario.
            For `consistent_check_ins`, this is a far-future sentinel value.
        seconds_until_release:
          type: integer
          format: int64
          description: >
            Seconds from simulation time until projected release.
            -1 means the vault will never release under this scenario.
        confidence:
          type: string
          enum: [high, medium, low]
          description: >
            Confidence in the projection.
            `high` — deterministic given vault state.
            `medium` — 1–2 missed check-ins assumed.
            `low` — 3+ missed check-ins assumed (higher uncertainty).
        notes:
          type: string
          description: Additional context about the scenario's assumptions and calculations
      required:
        - scenario
        - description
        - projected_release_at
        - seconds_until_release
        - confidence
        - notes

    SimulateReleaseResponse:
      type: object
      description: Response containing simulation results for one or more release scenarios
      properties:
        vault_id:
          type: string
          description: The ID of the vault that was simulated
        current_ttl_remaining:
          type: integer
          format: int64
          nullable: true
          description: Current TTL remaining in seconds; null if not known or already expired
        check_in_interval:
          type: integer
          format: int64
          description: The vault's configured check-in interval in seconds
        last_check_in:
          type: string
          format: date-time
          description: Timestamp of the last recorded check-in
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioResult'
          description: Simulation results, one per requested scenario
        simulated_at:
          type: string
          format: date-time
          description: Timestamp when this simulation was generated
      required:
        - vault_id
        - check_in_interval
        - last_check_in
        - scenarios
        - simulated_at

