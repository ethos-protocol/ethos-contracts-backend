          properties:
            operation:
              type: string
          required: [operation]
        - type: object
          properties:
            tag:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required: [key, value]
          required: [tag]

    SetBudgetThresholdRequest:
      type: object
      properties:
        category:
          type: string
        scope:
          $ref: '#/components/schemas/BudgetScope'
        limit:
          type: number
          format: double
      required: [category, scope, limit]

