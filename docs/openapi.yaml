          additionalProperties: true
      required:
        - vault_id
        - event_type
        - timestamp

    AuditEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - action
        - actor

    ExportData:
      type: object
      properties:
        vault:
          $ref: '#/components/schemas/Vault'
        history:
          type: array
