components:
  responses:
    RouterSurface:
      description: Response for this backend router operation.
  schemas:
    # ── Time-Series schemas ────────────────────────────────────────────────

    IngestRequest:
      type: object
      properties:
        series:
          type: string
          description: Series name (e.g. vault.balance, check_in.count)
          example: vault.balance
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp (defaults to now)
        value:
          type: number
          format: double
        tags:
          type: object
          additionalProperties:
            type: string
      required:
        - series
        - value

    TimeSeriesQueryRequest:
      type: object
      properties:
        series:
          type: string
        resolution:
          type: string
          enum: [raw, hourly, daily, weekly]
          default: raw
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - series

    TimeSeriesQueryResponse:
      type: object
      properties:
        series:
          type: string
        resolution:
          type: string
          enum: [raw, hourly, daily, weekly]
        points:
          type: array
          items:
            $ref: '#/components/schemas/TSPoint'
        count:
          type: integer
      required:
        - series
        - resolution
        - points
        - count

    TSPoint:
      type: object
      properties:
        series:
          type: string
        timestamp:
          type: string
          format: date-time
        value:
          type: number
          format: double
        tags:
          type: object
          additionalProperties:
            type: string
      required:
        - series
        - timestamp
        - value

    CompressResponse:
      type: object
      properties:
        series:
          type: string
        bytes_saved:
          type: integer
        partitions_compressed:
          type: integer
      required:
        - series
        - bytes_saved
        - partitions_compressed

    SetRetentionRequest:
      type: object
      properties:
        raw_retention_days:
          type: integer
          minimum: 1
          description: Days to keep raw data
        hourly_retention_days:
          type: integer
          description: Days to keep hourly downsampled data (0 = disabled)
        daily_retention_days:
          type: integer
          description: Days to keep daily downsampled data (0 = disabled)
      required:
        - raw_retention_days

    RetentionPolicy:
      type: object
      properties:
        series:
          type: string
        raw_retention_days:
          type: integer
        hourly_retention_days:
          type: integer
        daily_retention_days:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - series
        - raw_retention_days
        - hourly_retention_days
        - daily_retention_days

    BenchmarkResult:
      type: object
      properties:
        series:
          type: string
        raw_point_count:
          type: integer
        raw_bytes:
          type: integer
        compressed_bytes:
          type: integer
        compression_ratio:
          type: number
          format: double
        downsampled_hourly_count:
          type: integer
        downsampled_daily_count:
          type: integer
        partitions_created:
          type: integer
        points_pruned_by_retention:
          type: integer
        benchmark_ran_at:
          type: string
          format: date-time
      required:
        - series
        - raw_point_count
        - compression_ratio

    # ── Bulk Job schemas ───────────────────────────────────────────────────

    BulkOperationType:
      type: string
      enum: [update_ttl, send_reminders, export_vaults, retention_sweep, custom]

    JobStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]

    BulkJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/BulkOperationType'
        payload:
          description: Input data supplied at job creation
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage
        total_items:
          type: integer
        processed_items:
          type: integer
        failed_items:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        result:
          nullable: true
          description: Structured result (available when completed)
        error:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
      required:
        - id
        - operation
        - status
        - progress
        - total_items

    CreateJobRequest:
      type: object
      properties:
        operation:
          $ref: '#/components/schemas/BulkOperationType'
        items:
          description: Array of items to process (e.g. vault IDs for update_ttl)
          example: ["vault-1", "vault-2", "vault-3"]
        label:
          type: string
          description: Optional human-readable label for this job
      required:
        - operation
        - items

    CreateJobResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
      required:
        - job_id
        - status
        - message

    JobStatusResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/BulkJob'
        estimated_seconds_remaining:
          type: integer
          nullable: true
          description: Linear extrapolation of seconds until completion
      required:
        - job

    # ── Cost Estimation schemas ────────────────────────────────────────────

    EstimateCostRequest:
      type: object
      properties:
        operation:
          type: string
          enum: [create_vault, check_in, deposit, withdraw, trigger_release, update_beneficiary, bulk_check_in, custom]
        vault_id:
          type: string
          nullable: true
          description: Optional vault ID for vault-specific estimation
        amount_stroops:
          type: integer
          format: int64
          nullable: true
          description: Amount in stroops for deposit/withdraw operations
        bulk_count:
          type: integer
          format: int64
          nullable: true
          description: Number of vaults for bulk_check_in
        payload_bytes:
          type: integer
          format: int64
          nullable: true
          description: Payload size in bytes for custom operations
        include_scenarios:
          type: boolean
          default: false
          description: Include scenario variants in the response
      required:
        - operation

    CostBreakdown:
      type: object
      properties:
        base_fee_stroops:
          type: integer
          format: int64
        instruction_fee_stroops:
          type: integer
          format: int64
        write_entries_fee_stroops:
          type: integer
          format: int64
        read_entries_fee_stroops:
          type: integer
          format: int64
        rent_fee_stroops:
          type: integer
          format: int64
        total_stroops:
          type: integer
          format: int64
        total_xlm:
          type: number
          format: double
          description: Total cost in XLM (total_stroops / 10,000,000)
        notes:
          type: array
          items:
            type: string
          description: Human-readable explanation of cost drivers
      required:
        - total_stroops
        - total_xlm

    EstimateCostResponse:
      type: object
      properties:
        operation:
          type: string
        breakdown:
          $ref: '#/components/schemas/CostBreakdown'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/CostScenario'
          description: Scenario variants (populated when include_scenarios=true)
        estimated_at:
          type: string
          format: date-time
        docs_url:
          type: string
          description: Link to cost factor documentation
      required:
        - operation
        - breakdown
        - estimated_at
        - docs_url

    CostScenario:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        breakdown:
          $ref: '#/components/schemas/CostBreakdown'
      required:
        - name
        - description
        - breakdown

    # ── Request Replay schemas ─────────────────────────────────────────────

    RequestLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers (Authorization stripped)
        request_body:
          nullable: true
          description: Original request body
        response_status:
          type: integer
        response_body:
          description: Original response body
        duration_ms:
          type: integer
          description: Original processing time in milliseconds
        recorded_at:
          type: string
          format: date-time
        tag:
          type: string
          nullable: true
      required:
        - id
        - method
        - path
        - response_status
        - recorded_at

    ReplayCondition:
      type: object
      description: |
        A condition that must be met before the replay executes.
        Exactly one of the condition variants must be specified.
      properties:
        original_status_equals:
          type: integer
          description: Only replay if original status equals this code
        path_contains:
          type: string
          description: Only replay if request path contains this substring
        body_key_equals:
          type: object
          properties:
            key:
              type: string
            value:
              description: JSON value to match against
          description: Only replay if request body has this key=value
        always:
          type: boolean
          description: Always replay (default)

    ReplayRequest:
      type: object
      properties:
        log_id:
          type: string
          format: uuid
          description: ID of the log entry to replay
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ReplayCondition'
          description: Optional conditions — all must pass for the replay to proceed
        validate:
          type: boolean
          default: true
          description: Compare replayed response to original and report differences
      required:
        - log_id

    ReplayOutcome:
      type: string
      enum: [identical, diverged, skipped, unvalidated]

    ReplayResult:
      type: object
      properties:
        log_id:
          type: string
          format: uuid
        method:
          type: string
        path:
          type: string
        original_status:
          type: integer
        replayed_status:
          type: integer
        replayed_body:
          description: Response body from the replay
        outcome:
          $ref: '#/components/schemas/ReplayOutcome'
        diff_notes:
          type: array
          items:
            type: string
          description: Human-readable diff summary (populated when outcome is diverged)
        replayed_at:
          type: string
          format: date-time
      required:
        - log_id
        - outcome
        - replayed_at

    BatchReplayRequest:
      type: object
      properties:
        log_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          description: IDs of log entries to replay
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ReplayCondition'
        validate:
          type: boolean
          default: true
      required:
        - log_ids

    BatchReplayResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReplayResult'
        total:
          type: integer
        identical:
          type: integer
        diverged:
          type: integer
        skipped:
          type: integer
      required:
        - results
        - total
        - identical
        - diverged
        - skipped

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        status_code:
          type: integer
          description: HTTP status code
      required:
        - error

    Locale:
      type: string
      enum: [en, es, fr, de]
      description: Supported locales

    Channel:
      type: string
      enum: [email, sms, push]
      description: Notification delivery channel

